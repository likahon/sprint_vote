services:
  - type: web
    name: sprint-vote
    env: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: sprint-vote-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://sprint-vote.onrender.com
      - key: SOCKET_CORS_ORIGIN
        value: https://sprint-vote.onrender.com

databases:
  - name: sprint-vote-db
    databaseName: sprint_vote
    user: sprint_vote_user